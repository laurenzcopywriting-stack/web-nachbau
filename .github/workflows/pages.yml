name: Auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Der Deploy braucht Schreibrechte auf Pages und ein OIDC-Token.
permissions:
  contents: read
  pages: write
  id-token: write

# Laeuft ein Deploy bereits, wird er nicht abgebrochen — sonst koennte eine
# halb ausgelieferte Seite stehen bleiben.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Der Basispfad kommt aus der Pages-Konfiguration. Damit stimmt er auch,
      # falls das Repo einmal umbenannt wird.
      - uses: actions/configure-pages@v5
        id: pages

      - run: npm run build
        env:
          BASE_PFAD: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
