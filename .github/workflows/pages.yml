name: Auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Die Kopien liegen seit dem Umzug auf Netlify. Von hier geht deshalb
      # nur noch `weiterleitung/` nach oben: jede alte Adresse fuehrt zur
      # neuen, statt eine zweite, nicht mehr gepflegte Fassung auszuliefern.
      #
      # Der Quelltext der Kopien bleibt im Repo — er ist die Quelle, aus der
      # werkzeug/netlify_bauen.py die Netlify-Sites erzeugt.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: weiterleitung

      - uses: actions/deploy-pages@v4
        id: deploy
